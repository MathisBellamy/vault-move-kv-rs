name: rust-build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: target/release/vault-move-kv-rs
        token: '${{ secrets.INTEGRATION_TOKEN }}'
